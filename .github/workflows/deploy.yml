name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# Semua nilai konfigurasi disuntik dari GitHub Secrets
# (Settings → Secrets and variables → Actions). Tidak ada nilai
# environment-specific yang di-commit ke repo.
env:
  # Kredensial
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # Konfigurasi deployment
  WORKER_NAME: ${{ secrets.WORKER_NAME }}
  D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  APP_URL: ${{ secrets.APP_URL }}
  APP_DOMAIN: ${{ secrets.APP_DOMAIN }}

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate wrangler.jsonc dari template + secrets
        run: npm run cf:config

      - name: Validate required secrets
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          fail=0
          for var in D1_DATABASE_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JWT_SECRET ENCRYPTION_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret tidak ter-set. Deploy dibatalkan."
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            exit 1
          fi

          # ENCRYPTION_KEY wajib 64 karakter hex (32 byte) sesuai kontrak
          # src/worker/utils/crypto.ts. Key salah format HARUS gagal di sini,
          # sebelum sempat mengenkripsi data produksi dengan key yang rusak.
          if ! [[ "$ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::ENCRYPTION_KEY harus 64 karakter hex (32 byte). Generate dengan: openssl rand -hex 32"
            exit 1
          fi

          # JWT_SECRET minimal 32 karakter (HMAC-SHA256 signing key).
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "::error::JWT_SECRET minimal 32 karakter. Generate dengan: openssl rand -base64 48"
            exit 1
          fi

          echo "Semua secret yang dibutuhkan tersedia dan formatnya valid."

      # PENTING: ENCRYPTION_KEY dan JWT_SECRET TIDAK di-sync dari CI ke
      # Cloudflare pada setiap deploy. Secret enkripsi adalah infrastruktur
      # immutable — menimpanya diam-diam membuat semua password yang sudah
      # terenkripsi tidak bisa didekripsi lagi (AES-GCM tanpa recovery).
      #
      # Set sekali manual oleh admin dari mesin lokal:
      #   npx wrangler secret put ENCRYPTION_KEY   # openssl rand -hex 32
      #   npx wrangler secret put JWT_SECRET       # openssl rand -base64 48
      #
      # Rotasi hanya boleh dilakukan secara sadar dengan re-enkripsi data.

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test

      - name: Build client assets
        run: npm run build

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test health endpoint
        run: |
          url="${APP_URL:-https://${APP_DOMAIN}}"
          for i in 1 2 3 4 5; do
            if curl -fsS "$url/api/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke test gagal di $url/api/health"
          exit 1
