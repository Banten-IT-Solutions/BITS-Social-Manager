name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test

      - name: Build client assets
        run: npm run build

      - name: Validate required secrets
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          for var in D1_DATABASE_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JWT_SECRET ENCRYPTION_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret tidak ter-set. Deploy dibatalkan."
              exit 1
            fi
          done
          echo "Semua secret yang dibutuhkan tersedia."

      - name: Sync Worker secrets from GitHub secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          printf '%s' "$ENCRYPTION_KEY" | npx wrangler secret put ENCRYPTION_KEY

      - name: Inject D1 database ID into wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          sed -i "s|database_id = \"local-dev-id\"|database_id = \"$D1_DATABASE_ID\"|" wrangler.toml
          echo "Sanity check:"
          grep -E "database_id|pattern" wrangler.toml

      - name: Deploy Worker & apply D1 migrations & sync secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            wrangler d1 migrations apply social-manager-db --remote
          command: deploy

      - name: Announce deployment URL
        id: deploy_output
        run: echo "Deploy selesai — lihat detail di Cloudflare Dashboard"

      - name: Smoke test health endpoint
        run: |
          domain=$(sed -n 's/^pattern = "\(.*\)"$/\1/p' wrangler.toml | head -n 1)
          url="https://${domain}"
          for i in 1 2 3 4 5; do
            if curl -fsS "$url/api/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke test gagal"
          exit 1
