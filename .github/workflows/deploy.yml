name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test

      - name: Build client assets
        run: npm run build

      - name: Validate required secrets
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          for var in D1_DATABASE_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JWT_SECRET ENCRYPTION_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret tidak diset. Deploy dibatalkan."
              exit 1
            fi
          done
          echo "Semua secret yang dibutuhkan tersedia."

      - name: Inject D1 database ID into wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          # custom_domain = true → zone id di-resolve otomatis dari akun
          sed -i "s|database_id = \"local-dev-id\"|database_id = \"$D1_DATABASE_ID\"|" wrangler.toml
          echo "Sanity check:"
          grep -E "database_id|pattern" wrangler.toml

      - name: Deploy Worker & apply D1 migrations & sync secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            wrangler d1 migrations apply social-manager-db --remote
          command: deploy
          secrets: |
            JWT_SECRET
            ENCRYPTION_KEY
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      - name: Announce deployment URL
        id: deploy_output
        run: echo "Deploy ke https://social.bits.co.id selesai — lihat detail di Cloudflare Dashboard"