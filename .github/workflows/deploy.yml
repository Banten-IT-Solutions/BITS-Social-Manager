name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test

      - name: Build client assets
        run: npm run build

      - name: Inject D1 database ID into wrangler.toml
        run: |
          # D1 database ID (wajib) — custom domain tidak perlu di-inject lagi
          # (custom_domain = true → wrangler resolve zone_id otomatis dari akun)
          if [ -n "${{ secrets.D1_DATABASE_ID }}" ]; then
            sed -i "s|database_id = \"local-dev-id\"|database_id = \"${{ secrets.D1_DATABASE_ID }}\"|" wrangler.toml
          else
            echo "::warning::D1_DATABASE_ID secret not set. Using database_id from wrangler.toml."
          fi

          echo "Sanity check:"
          grep -E "database_id|pattern" wrangler.toml

      - name: Deploy Worker & apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            d1 migrations apply social-manager-db --remote
            deploy
