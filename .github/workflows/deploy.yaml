name: '🚀 Deploy'

on:
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NODE_NO_WARNINGS: 1
  WORKER_NAME: ${{ vars.WORKER_NAME || secrets.WORKER_NAME }}
  D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || secrets.D1_DATABASE_NAME }}
  D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
  APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
  APP_DOMAIN: ${{ vars.APP_DOMAIN || secrets.APP_DOMAIN }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: '☁️ Deploy to Cloudflare'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v7.0.1

      - name: '🟢 Setup Node.js'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: '📚 Install dependencies'
        run: npm ci

      - name: '🔍 Type check'
        run: npm run type-check

      - name: '🧪 Run tests'
        run: npm run test

      - name: '🏗️ Build'
        run: npm run build

      - name: '🗄️ Apply D1 migrations'
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: '🚀 Deploy Worker'
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: '🔐 Sync secrets'
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const secrets={};
            for (const k of ["JWT_SECRET","ENCRYPTION_KEY"]) {
              if (process.env[k]) secrets[k]=process.env[k];
            }
            if (Object.keys(secrets).length) {
              fs.writeFileSync(".worker-secrets.json", JSON.stringify(secrets));
              console.log("Secrets to sync:", Object.keys(secrets).join(", "));
            } else {
              console.log("No secrets to sync");
            }
          '
          if [ -f .worker-secrets.json ]; then
            npx wrangler secret bulk .worker-secrets.json --config wrangler.jsonc
            rm -f .worker-secrets.json
          fi

      - name: '✅ Smoke test'
        run: |
          url="${APP_URL:-https://${APP_DOMAIN}}"
          for i in 1 2 3 4 5; do
            if curl -fsS "$url/api/health"; then
              echo "Health check passed at $url/api/health"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed at $url/api/health"
          exit 1
