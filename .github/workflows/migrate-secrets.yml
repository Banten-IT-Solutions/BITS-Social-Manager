name: Migrate Secrets to bits-social-manager
on:
  workflow_dispatch:
jobs:
  put-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        # dummy cf:config not needed for secret put, but run to ensure wrangler config exists
      - name: Put secrets to new worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --name bits-social-manager
          echo "$ENCRYPTION_KEY" | npx wrangler secret put ENCRYPTION_KEY --name bits-social-manager
          echo "Secrets migrated to bits-social-manager"
          npx wrangler secret list --name bits-social-manager
